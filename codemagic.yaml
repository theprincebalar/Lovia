workflows:
  ios-release:
    name: Lovia iOS Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_ID: "com.lovia.ai.friend.app.lovia"
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          if [ -n "$CM_CERTIFICATE" ]; then
            echo "Using manual uploaded certificates from Codemagic UI..."
            keychain add-certificates
            xcode-project use-profiles
          else
            echo "Using App Store Connect API integration..."
            app-store-connect fetch-signing-files "$APP_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
          fi
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update
      - name: Flutter build iOS
        script: |
          flutter build ios --release --no-codesign
      - name: Build and Sign IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - theprincebalar@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Lovia Android Release Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - theprincebalar@gmail.com
        notify:
          success: true
          failure: true
